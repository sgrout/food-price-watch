[build-system]
requires = ["setuptools>=77"]  # PEP 639 license field
build-backend = "setuptools.build_meta"

[project]
name = "food-price-watch"
version = "0.1.0"
description = "Open, probabilistic early warning for staple food price spikes (WFP prices on HDX), on Databricks"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# On Databricks serverless, requests and pandas come with the runtime.
dependencies = ["requests", "pandas>=2.2,<3"]  # pandas 3 not yet supported by PySpark

[project.optional-dependencies]
# Private dashboard (app/), deployed as a Databricks App.
app = ["streamlit==1.38.0", "plotly==5.24.1", "databricks-sql-connector", "databricks-sdk"]  # mirrors app/requirements.txt + the Apps runtime
# Local development only. On Databricks, Spark is provided by the runtime.
# Forecasting models. On Databricks: scipy and scikit-learn come with the runtime, lightgbm via the job environment.
ml = ["scipy", "scikit-learn", "lightgbm==4.7.0", "mlflow-skinny"]
dev = ["pytest", "pyyaml", "pyspark~=4.0", "plotly", "jsonschema", "food-price-watch[ml]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fpw*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "app"]
testpaths = ["tests"]

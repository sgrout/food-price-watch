bundle:
  name: food_price_watch

include:
  - resources/*.yml

sync:
  exclude:
    - tests/**
    - .github/**
    - data/**

workspace:
  # Free Edition workspace shared with fx_medallion; CLI profile Fx-Workspace.
  host: https://dbc-101f908c-607f.cloud.databricks.com

variables:
  catalog:
    default: workspace
  env:
    default: dev
  countries:
    description: Comma-separated HDX country slugs that are ingested and forecast (public ones are in public_countries)
    default: mali,burkina-faso,burundi,niger,chad
  public_countries:
    description: Countries in the public exports (item and basket); others are ingested and forecast but not exported until the owner's go
    default: mali,burkina-faso,burundi
  app_name:
    description: "App name: lowercase, digits, hyphens, max 30 chars (workspace-global, so per user in dev)"
    default: fpw-dev-${workspace.current_user.domain_friendly_name}
  warehouse_id:
    description: SQL warehouse the app queries
    lookup:
      warehouse: Serverless Starter Warehouse

# One catalog on Free Edition, so environments are schema prefixes: workspace.fpw_dev_bronze / silver / gold / ml.
targets:
  dev:
    # Not `mode: development`: that mode pauses every schedule and does not allow unpausing them (fx_medallion
    # lesson). dev is the only environment for now, so it keeps its schedules; presets keep the visible prefix.
    default: true
    presets:
      name_prefix: "[dev] "
      trigger_pause_status: UNPAUSED
    variables:
      env: dev

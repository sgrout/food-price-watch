resources:
  jobs:
    fpw_pipeline:
      name: fpw_pipeline_${var.env}
      description: WFP food prices (HDX) -> bronze -> silver + quality -> gold coverage + freshness -> live forecast + scoring

      # Weekly, Monday 07:00 Amsterdam. HDX files change a few times a month; weekly snapshots tell us when each
      # month first appears (publication lag) at the cost of a metadata check when nothing changed.
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"
        timezone_id: Europe/Amsterdam
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: env
          default: ${var.env}
        - name: countries
          default: ${var.countries}
        # Public status of the export: preview (not public) | beta (public, beta banner) | published
        - name: export_status
          default: beta

      # No cluster defined = serverless compute (the only option on Free Edition). The live tasks load the
      # registered LightGBM model, so they need lightgbm.
      environments:
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - lightgbm==4.7.0

      tasks:
        - task_key: bronze_hdx
          notebook_task:
            notebook_path: ../src/01_bronze_hdx.py

        - task_key: silver_prices
          depends_on:
            - task_key: bronze_hdx
          notebook_task:
            notebook_path: ../src/02_silver_prices.py

        - task_key: gold_coverage
          depends_on:
            - task_key: silver_prices
          notebook_task:
            notebook_path: ../src/03_gold_coverage.py

        # Live forecast with @champion (trained monthly by fpw_training), appended to gold.live_forecasts
        - task_key: live_forecast
          depends_on:
            - task_key: gold_coverage
          environment_key: ml
          notebook_task:
            notebook_path: ../src/06_live_forecast.py

        - task_key: score_live
          depends_on:
            - task_key: live_forecast
          environment_key: ml
          notebook_task:
            notebook_path: ../src/07_score_live.py

        # Public export (JSON/CSV) to the volume fpw_<env>_gold.public_export, fetched by the public site
        - task_key: export_public
          depends_on:
            - task_key: score_live
          notebook_task:
            notebook_path: ../src/08_export_public.py

resources:
  jobs:
    fpw_backtest:
      name: fpw_backtest_${var.env}
      description: Walk-forward backtest of baselines, pooled LightGBM and recalibrated variants (manual runs)

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: env
          default: ${var.env}
        - name: experiment_id
          default: ${resources.experiments.fpw_backtest_experiment.id}
        - name: first_origin_year
          default: "2008"
        - name: first_ml_year
          default: "2012"

      # Serverless environment: lightgbm on top of the runtime (pandas, numpy, scipy, scikit-learn, mlflow).
      environments:
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - lightgbm==4.7.0

      # No schedule: run after a model change. No cluster = serverless.
      tasks:
        - task_key: backtest
          environment_key: ml
          notebook_task:
            notebook_path: ../src/04_backtest.py
